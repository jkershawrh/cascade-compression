name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      claim_level: ${{ steps.profile.outputs.claim_level }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: Enforce the public/private repository boundary
        run: python3 scripts/check_public_boundary.py
      - name: Verify tag, package version, and release profile
        id: profile
        run: |
          python - <<'PY'
          import json
          import pathlib
          import tomllib
          import os
          import re

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag!r} does not match package {version!r}"
          profile = json.loads(pathlib.Path("config/release-profile.json").read_text())
          assert profile["schema_version"] == "cascade.release-profile.v1alpha1"
          claim_level = profile["claim_level"]
          assert claim_level in {"incubating_oss", "staging_qualified"}
          assert profile["staging_evidence_required"] is (
              claim_level == "staging_qualified"
          )
          assert isinstance(profile.get("limitations"), list) and profile["limitations"]
          if claim_level == "incubating_oss":
              assert re.search(r"(?:a|b|rc)\d+$", version), (
                  "incubating OSS releases must use a prerelease version"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"claim_level={claim_level}\n")
          PY
      - run: uv sync --extra dev --extra semantic-classifier --locked
      - name: Verify container dependency lock
        run: |
          uv export --frozen --no-dev --extra semantic-classifier \
            --no-emit-project --no-header \
            --format requirements-txt --output-file /tmp/requirements-container.lock
          diff -u requirements-container.lock /tmp/requirements-container.lock
          uv export --frozen --only-group build --no-emit-project --no-header \
            --format requirements-txt --output-file /tmp/requirements-build.lock
          diff -u requirements-build.lock /tmp/requirements-build.lock
      - run: uv run pytest -q
      - name: Prove the generated gRPC client is importable
        run: uv run python scripts/semantic_adapter_smoke.py
      - run: uv build
      - name: Smoke-test installed wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/release_smoke.py"
  evidence:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      image: ${{ steps.candidate.outputs.image }}
      digest: ${{ steps.candidate.outputs.image_digest }}
      candidate_run_id: ${{ steps.candidate.outputs.candidate_run_id }}
      claim_level: ${{ needs.verify.outputs.claim_level }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --extra dev --locked
      - name: Download attested candidate manifest for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_NAME: cascade-staging-candidate-${{ github.sha }}
        run: |
          artifact_id=$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$CANDIDATE_NAME" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id')
          if [[ -z "$artifact_id" || "$artifact_id" == "null" ]]; then
            echo "No unexpired candidate artifact exists for $GITHUB_SHA" >&2
            exit 1
          fi
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > candidate-manifest.zip
          mkdir -p release-evidence/candidate
          unzip -q candidate-manifest.zip -d release-evidence/candidate
          cp config/release-profile.json release-evidence/release-profile.json
      - name: Verify candidate provenance and binding
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            release-evidence/candidate/staging-candidate-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/staging-candidate.yml" \
            --source-digest "$GITHUB_SHA"
          uv run python scripts/verify_staging_handoff.py \
            --candidate-manifest release-evidence/candidate/staging-candidate-manifest.json \
            --expected-commit "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --output release-evidence/candidate-summary.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          summary = json.load(open("release-evidence/candidate-summary.json", encoding="utf-8"))
          print(f"image={summary['image']}")
          print(f"image_digest={summary['image_digest']}")
          print(f"candidate_run_id={summary['candidate_workflow_run_id']}")
          PY
      - name: Download staging qualification for this commit
        if: needs.verify.outputs.claim_level == 'staging_qualified'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_NAME: cascade-staging-evidence-${{ github.sha }}
        run: |
          artifact_id=$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$EVIDENCE_NAME" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id')
          if [[ -z "$artifact_id" || "$artifact_id" == "null" ]]; then
            echo "No unexpired staging-evidence artifact exists for $GITHUB_SHA" >&2
            exit 1
          fi
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > staging-evidence.zip
          mkdir staging-handoff
          unzip -q staging-evidence.zip -d staging-handoff
          cp staging-handoff/staging-evidence.json release-evidence/staging-evidence.json
      - name: Verify staging qualification and candidate binding
        if: needs.verify.outputs.claim_level == 'staging_qualified'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify staging-handoff/staging-evidence.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/staging-evidence.yml"
          uv run python scripts/verify_staging_handoff.py \
            --evidence staging-handoff/staging-evidence.json \
            --candidate-manifest release-evidence/candidate/staging-candidate-manifest.json \
            --expected-commit "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --output release-evidence/handoff-summary.json
      - name: Download and verify exact tested package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.candidate_run_id }}
        run: |
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "cascade-staging-package-$GITHUB_SHA" \
            --dir candidate-package
          for artifact in candidate-package/*; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/staging-candidate.yml" \
              --source-digest "$GITHUB_SHA"
          done
          uv run python scripts/verify_staging_handoff.py \
            --candidate-manifest release-evidence/candidate/staging-candidate-manifest.json \
            --candidate-package candidate-package \
            --expected-commit "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --output release-evidence/candidate-summary.json
      - name: Verify package remains bound to staging qualification
        if: needs.verify.outputs.claim_level == 'staging_qualified'
        run: |
          uv run python scripts/verify_staging_handoff.py \
            --evidence release-evidence/staging-evidence.json \
            --candidate-manifest release-evidence/candidate/staging-candidate-manifest.json \
            --candidate-package candidate-package \
            --expected-commit "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --output release-evidence/handoff-summary.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tested candidate image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.image_digest }}
        run: |
          gh attestation verify "oci://$CANDIDATE_IMAGE@$CANDIDATE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/staging-candidate.yml" \
            --source-digest "$GITHUB_SHA" \
            --bundle-from-oci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-release-evidence-${{ github.sha }}
          path: release-evidence/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-release-package-${{ github.sha }}
          path: candidate-package/
          retention-days: 90
          if-no-files-found: error

  container:
    needs: [verify, evidence]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ needs.evidence.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') }}
      - name: Promote the exact tested candidate digest
        env:
          CANDIDATE_IMAGE: ${{ needs.evidence.outputs.image }}
          CANDIDATE_DIGEST: ${{ needs.evidence.outputs.digest }}
          RELEASE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              args+=(--tag "$tag")
            fi
          done <<< "$RELEASE_TAGS"
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "No release tags were generated" >&2
            exit 1
          fi
          docker buildx imagetools create \
            "${args[@]}" "$CANDIDATE_IMAGE@$CANDIDATE_DIGEST"
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              observed=$(docker buildx imagetools inspect "$tag" \
                --format '{{.Manifest.Digest}}')
              test "$observed" = "$CANDIDATE_DIGEST"
            fi
          done <<< "$RELEASE_TAGS"
      - name: Write immutable container manifest
        env:
          RELEASE_CLAIM_LEVEL: ${{ needs.evidence.outputs.claim_level }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DIGEST: ${{ needs.evidence.outputs.digest }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          manifest = {
              "schema_version": "cascade.release-container.v1alpha1",
              "repository": os.environ["RELEASE_REPOSITORY"],
              "commit": os.environ["RELEASE_COMMIT"],
              "tag": os.environ["RELEASE_TAG"],
              "claim_level": os.environ["RELEASE_CLAIM_LEVEL"],
              "image": f"ghcr.io/{os.environ['RELEASE_REPOSITORY']}",
              "image_digest": os.environ["RELEASE_DIGEST"],
              "multi_arch": ["linux/amd64", "linux/arm64"],
              "container_sbom": True,
              "container_provenance": True,
              "generated_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("release-container-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-release-container-${{ github.sha }}
          path: release-container-manifest.json
          retention-days: 90
          if-no-files-found: error

  release:
    needs: [verify, evidence, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cascade-release-package-${{ github.sha }}
          path: release-package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cascade-release-container-${{ github.sha }}
          path: release-container
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cascade-release-evidence-${{ github.sha }}
          path: release-evidence
      - name: Write release artifact manifest
        env:
          RELEASE_CLAIM_LEVEL: ${{ needs.evidence.outputs.claim_level }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DIGEST: ${{ needs.container.outputs.digest }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          artifacts = []
          for directory in (
              Path("release-package"), Path("release-container"),
              Path("release-evidence"),
          ):
              for path in sorted(directory.rglob("*")):
                  if path.is_file():
                      payload = path.read_bytes()
                      artifacts.append({
                          "name": path.name,
                          "sha256": "sha256:" + hashlib.sha256(payload).hexdigest(),
                          "bytes": len(payload),
                      })
          assert any(item["name"].endswith(".whl") for item in artifacts)
          assert any(item["name"].endswith(".tar.gz") for item in artifacts)
          assert any(item["name"].endswith(".spdx.json") for item in artifacts)
          assert any(item["name"] == "release-container-manifest.json" for item in artifacts)
          assert any(item["name"] == "staging-candidate-manifest.json" for item in artifacts)
          assert any(item["name"] == "candidate-summary.json" for item in artifacts)
          assert any(item["name"] == "release-profile.json" for item in artifacts)
          if os.environ["RELEASE_CLAIM_LEVEL"] == "staging_qualified":
              assert any(item["name"] == "staging-evidence.json" for item in artifacts)
              assert any(item["name"] == "handoff-summary.json" for item in artifacts)
          else:
              assert os.environ["RELEASE_CLAIM_LEVEL"] == "incubating_oss"
              assert not any(item["name"] == "staging-evidence.json" for item in artifacts)

          manifest = {
              "schema_version": "cascade.release-artifacts.v1alpha2",
              "repository": os.environ["RELEASE_REPOSITORY"],
              "commit": os.environ["RELEASE_COMMIT"],
              "tag": os.environ["RELEASE_TAG"],
              "claim_level": os.environ["RELEASE_CLAIM_LEVEL"],
              "image_digest": os.environ["RELEASE_DIGEST"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifacts": artifacts,
          }
          with open("release-artifact-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Attest release artifact manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifact-manifest.json
      - name: Create GitHub release only after package and container succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CLAIM_LEVEL: ${{ needs.evidence.outputs.claim_level }}
        run: |
          args=(
            "$GITHUB_REF_NAME"
            release-package/*
            release-container/release-container-manifest.json
            release-evidence/candidate/staging-candidate-manifest.json
            release-evidence/candidate-summary.json
            release-evidence/release-profile.json
            release-artifact-manifest.json
            --generate-notes
            --verify-tag
          )
          if [[ "$RELEASE_CLAIM_LEVEL" == "staging_qualified" ]]; then
            args+=(
              release-evidence/staging-evidence.json
              release-evidence/handoff-summary.json
              --title "$GITHUB_REF_NAME — staging-qualified"
            )
          else
            args+=(--title "$GITHUB_REF_NAME — incubating OSS")
          fi
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
