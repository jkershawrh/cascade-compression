name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: Enforce the public/private repository boundary
        run: python3 scripts/check_public_boundary.py
      - name: Verify tag and package version
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          import os

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag!r} does not match package {version!r}"
          PY
      - run: uv sync --extra dev --extra semantic-classifier --locked
      - name: Verify container dependency lock
        run: |
          uv export --frozen --no-dev --extra semantic-classifier \
            --no-emit-project --no-header \
            --format requirements-txt --output-file /tmp/requirements-container.lock
          diff -u requirements-container.lock /tmp/requirements-container.lock
          uv export --frozen --only-group build --no-emit-project --no-header \
            --format requirements-txt --output-file /tmp/requirements-build.lock
          diff -u requirements-build.lock /tmp/requirements-build.lock
      - run: uv run pytest -q
      - name: Prove the generated gRPC client is importable
        run: uv run python scripts/semantic_adapter_smoke.py
      - run: uv build
      - name: Smoke-test installed wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - name: Generate package SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/cascade-compression-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-release-package-${{ github.sha }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

  container:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Write immutable container manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          manifest = {
              "schema_version": "cascade.release-container.v1alpha1",
              "repository": os.environ["RELEASE_REPOSITORY"],
              "commit": os.environ["RELEASE_COMMIT"],
              "tag": os.environ["RELEASE_TAG"],
              "image": f"ghcr.io/{os.environ['RELEASE_REPOSITORY']}",
              "image_digest": os.environ["RELEASE_DIGEST"],
              "multi_arch": ["linux/amd64", "linux/arm64"],
              "container_sbom": True,
              "container_provenance": True,
              "generated_at": datetime.now(timezone.utc).isoformat(),
          }
          with open("release-container-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-release-container-${{ github.sha }}
          path: release-container-manifest.json
          retention-days: 90
          if-no-files-found: error

  release:
    needs: [verify, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cascade-release-package-${{ github.sha }}
          path: release-package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cascade-release-container-${{ github.sha }}
          path: release-container
      - name: Write release artifact manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DIGEST: ${{ needs.container.outputs.digest }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          artifacts = []
          for directory in (Path("release-package"), Path("release-container")):
              for path in sorted(directory.iterdir()):
                  if path.is_file():
                      payload = path.read_bytes()
                      artifacts.append({
                          "name": path.name,
                          "sha256": "sha256:" + hashlib.sha256(payload).hexdigest(),
                          "bytes": len(payload),
                      })
          assert any(item["name"].endswith(".whl") for item in artifacts)
          assert any(item["name"].endswith(".tar.gz") for item in artifacts)
          assert any(item["name"].endswith(".spdx.json") for item in artifacts)
          assert any(item["name"] == "release-container-manifest.json" for item in artifacts)

          manifest = {
              "schema_version": "cascade.release-artifacts.v1alpha1",
              "repository": os.environ["RELEASE_REPOSITORY"],
              "commit": os.environ["RELEASE_COMMIT"],
              "tag": os.environ["RELEASE_TAG"],
              "image_digest": os.environ["RELEASE_DIGEST"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "artifacts": artifacts,
          }
          with open("release-artifact-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Attest release artifact manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifact-manifest.json
      - name: Create GitHub release only after package and container succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "$GITHUB_REF_NAME"
            release-package/*
            release-container/release-container-manifest.json
            release-artifact-manifest.json
            --generate-notes
            --verify-tag
          )
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
