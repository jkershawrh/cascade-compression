name: Public safety scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  internal-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject internal infrastructure references
        run: |
          if grep -RInEi \
            'infra01|dal12|api\.ocpv|\.infra\.demo\.redhat\.com|oberon|babylon|poolboy|rhpds|stargate|sandbox\.conan|labagator' \
            . --exclude-dir=.git --exclude=public-safety.yml; then
            echo 'Internal infrastructure reference found'
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
