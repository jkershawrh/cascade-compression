name: Staging candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: Reject internal infrastructure references
        run: |
          if grep -RInEi \
            'infra01|dal12|api\.ocpv|\.infra\.demo\.redhat\.com|oberon|babylon|poolboy|rhpds|stargate|sandbox\.conan|labagator' \
            . --exclude-dir=.git --exclude=public-safety.yml --exclude=staging-candidate.yml; then
            echo 'Internal infrastructure reference found'
            exit 1
          fi
      - run: uv sync --extra dev --locked
      - name: Verify container dependency lock
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header \
            --format requirements-txt --output-file /tmp/requirements-container.lock
          diff -u requirements-container.lock /tmp/requirements-container.lock
          uv export --frozen --only-group build --no-emit-project --no-header \
            --format requirements-txt --output-file /tmp/requirements-build.lock
          diff -u requirements-build.lock /tmp/requirements-build.lock
      - run: make test-all PYTHON="uv run python"
      - run: uv build
      - name: Smoke-test installed wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/release_smoke.py"
      - name: Generate candidate package SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/cascade-compression-candidate-${{ github.sha }}.spdx.json
          upload-artifact: false
      - name: Attest candidate package artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-staging-package-${{ github.sha }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

  container:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=candidate-${{ github.sha }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest candidate container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cascade-staging-package-${{ github.sha }}
          path: candidate-package
      - name: Write immutable candidate manifest
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository }}
          CANDIDATE_DIGEST: ${{ steps.push.outputs.digest }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          package_artifacts = []
          for path in sorted(Path("candidate-package").iterdir()):
              if not path.is_file():
                  continue
              payload = path.read_bytes()
              package_artifacts.append({
                  "name": path.name,
                  "sha256": "sha256:" + hashlib.sha256(payload).hexdigest(),
                  "bytes": len(payload),
              })
          assert any(item["name"].endswith(".whl") for item in package_artifacts)
          assert any(item["name"].endswith(".tar.gz") for item in package_artifacts)
          assert any(item["name"].endswith(".spdx.json") for item in package_artifacts)

          manifest = {
              "schema_version": "cascade.staging-candidate.v1alpha2",
              "repository": os.environ["CANDIDATE_REPOSITORY"],
              "commit": os.environ["CANDIDATE_COMMIT"],
              "image": os.environ["CANDIDATE_IMAGE"],
              "image_digest": os.environ["CANDIDATE_DIGEST"],
              "workflow_run_id": os.environ["CANDIDATE_RUN_ID"],
              "workflow_run_attempt": int(os.environ["CANDIDATE_RUN_ATTEMPT"]),
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "multi_arch": ["linux/amd64", "linux/arm64"],
              "container_sbom": True,
              "container_provenance": True,
              "package_sbom": True,
              "package_provenance": True,
              "package_artifacts": package_artifacts,
          }
          with open("staging-candidate-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-staging-candidate-${{ github.sha }}
          path: staging-candidate-manifest.json
          retention-days: 90
          if-no-files-found: error
