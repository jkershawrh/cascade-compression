name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --locked
      - name: Test the documented Makefile path
        run: make test-all PYTHON="uv run python"

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv build
      - run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/release_smoke.py"
