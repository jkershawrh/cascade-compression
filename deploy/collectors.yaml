---
# Signal collector sidecars for infra01
#
# K8s collector: polls 5 OCP clusters, pushes to cascade-k8s
# AAP collector: polls AAP database, pushes to cascade-aap
#
# Reuses the same cluster tokens and AAP credentials as deepfield.
# Apply after openshift-federated.yaml.
#
# Usage:
#   oc apply -f deploy/collectors.yaml

---
# ── K8s Signal Collector ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-k8s
  namespace: cascade-compression
  labels:
    app: collector-k8s
    component: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector-k8s
  template:
    metadata:
      labels:
        app: collector-k8s
        component: collector
    spec:
      containers:
      - name: collector
        image: image-registry.openshift-image-registry.svc:5000/cascade-compression/cascade-compression:latest
        command:
        - python3
        - -m
        - cascade_compression.collector_sidecar
        - --mode=k8s
        - --target=http://cascade-k8s:8090
        - --interval=30
        envFrom:
        - secretRef:
            name: collector-clusters
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

---
# ── AAP Signal Collector ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-aap
  namespace: cascade-compression
  labels:
    app: collector-aap
    component: collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector-aap
  template:
    metadata:
      labels:
        app: collector-aap
        component: collector
    spec:
      containers:
      - name: collector
        image: image-registry.openshift-image-registry.svc:5000/cascade-compression/cascade-compression:latest
        command:
        - python3
        - -m
        - cascade_compression.collector_sidecar
        - --mode=aap
        - --target=http://cascade-aap:8090
        - --interval=30
        envFrom:
        - secretRef:
            name: collector-aap-db
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
