[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade-compression"
version = "0.1.0"
description = "Domain-agnostic three-tier signal compression for safe CPU inference"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Cascade Compression contributors"}]
keywords = ["inference", "signal-processing", "observability", "cpu", "routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "uvicorn[standard]>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "jsonschema>=4.0",
]
search = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.0",
    "sentence-transformers>=2.2.0",
]
finance = ["psycopg2-binary>=2.9"]

[project.urls]
Homepage = "https://github.com/jkershawrh/cascade-compression"
Documentation = "https://github.com/jkershawrh/cascade-compression#readme"
Issues = "https://github.com/jkershawrh/cascade-compression/issues"
Changelog = "https://github.com/jkershawrh/cascade-compression/blob/main/CHANGELOG.md"

[project.scripts]
compile-corpora = "cascade_compression.routing.compile_corpora:main"
cascade-run = "cascade_compression.cli:run"
cascade-replay = "cascade_compression.cli:replay"
cascade-value-export = "cascade_compression.value_evidence_cli:main"

[project.entry-points."cascade_compression.collectors"]
finance = "cascade_compression.collectors.finance:FinanceCollector"
healthcare = "cascade_compression.collectors.healthcare:HealthcareCollector"
insurance = "cascade_compression.collectors.insurance:InsuranceCollector"
kubernetes = "cascade_compression.collectors.kubernetes:KubernetesCollector"
macos = "cascade_compression.collectors.macos:MacOSCollector"
prometheus = "cascade_compression.collectors.prometheus:PrometheusCollector"
retail = "cascade_compression.collectors.retail:RetailCollector"
telecom = "cascade_compression.collectors.telecom:TelecomCollector"

[project.entry-points."cascade_compression.domains"]
finance = "cascade_compression.domains.finance"
healthcare = "cascade_compression.domains.healthcare"
insurance = "cascade_compression.domains.insurance"
kubernetes = "cascade_compression.domains.kubernetes"
macos = "cascade_compression.domains.macos"
retail = "cascade_compression.domains.retail"
telecom = "cascade_compression.domains.telecom"

[tool.setuptools.packages.find]
include = ["cascade_compression*"]

[tool.setuptools.data-files]
"share/cascade-compression/config" = ["config/*.json", "config/*.yaml"]
"share/cascade-compression/data" = ["data/*.json"]
"share/cascade-compression/frontend" = ["frontend/*"]
"share/cascade-compression/contracts" = ["contracts/*.json"]
"share/cascade-compression/contracts/schemas" = ["contracts/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
